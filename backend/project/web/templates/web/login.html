{% extends 'base.html' %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="bg-surface p-8 rounded-2xl shadow-xl border border-border w-full max-w-md">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary/10 mb-4">
                <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
            </div>
            <h2 class="text-2xl font-bold text-foreground">InventoryPro</h2>
            <p class="text-sm text-muted mt-2">Sign in to your account</p>
        </div>

        {% if messages %}
        <div class="mb-4">
            {% for message in messages %}
            <div class="p-4 bg-red-500/10 text-red-800 dark:text-red-200 border border-red-500/20 rounded-xl text-sm">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="mb-5">
                <label class="block text-sm font-medium text-foreground/80 mb-2">Username</label>
                <input type="text" name="username" class="w-full px-4 py-3 rounded-xl border border-border focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" required>
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-foreground/80 mb-2">Password</label>
                <input type="password" name="password" class="w-full px-4 py-3 rounded-xl border border-border focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" required>
            </div>
            <button type="submit" class="w-full bg-primary hover:bg-primary/90 text-white font-medium py-3 px-4 rounded-xl shadow-lg shadow-primary/30 transition-all active:scale-[0.98]">
                Sign In
            </button>
        </form>
    </div>
</div>
{% endblock %}
